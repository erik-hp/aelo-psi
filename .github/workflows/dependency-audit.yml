name: AELO-PSI Dependency Audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python audit tooling
        run: python -m pip install 'pip-audit>=2.7,<3'
      - name: Audit Django dependency declarations
        id: backend_audit
        continue-on-error: true
        run: |
          mkdir -p security-reports
          python -m pip_audit -r Backend/requirements/base.txt --format json --output security-reports/backend-base.json
      - name: Audit FastAPI dependency declarations
        id: ai_audit
        continue-on-error: true
        run: python -m pip_audit -r Backend/requirements/ai.txt --format json --output security-reports/ai-service.json
      - name: Audit frontend runtime dependencies
        id: frontend_audit
        continue-on-error: true
        working-directory: Frontend
        run: |
          mkdir -p ../security-reports
          npm audit --omit=dev --audit-level=high --json > ../security-reports/frontend-production.json
      - name: Summarize results and remaining blockers
        if: always()
        env:
          BACKEND_RESULT: ${{ steps.backend_audit.outcome }}
          AI_RESULT: ${{ steps.ai_audit.outcome }}
          FRONTEND_RESULT: ${{ steps.frontend_audit.outcome }}
        run: |
          {
            echo "## F0-05: dependency vulnerability inventory"
            echo "| Scope | Audit result |"
            echo "| --- | --- |"
            echo "| Django | $BACKEND_RESULT |"
            echo "| FastAPI | $AI_RESULT |"
            echo "| Frontend production | $FRONTEND_RESULT |"
            echo ""
            echo "Failed audits are triage items and block G0 closure."
            echo "This inventory is report-only, not a security certification."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-inventory
          path: security-reports/*.json
          if-no-files-found: warn
          retention-days: 30
