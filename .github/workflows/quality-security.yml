name: Quality and security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for exposed secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --no-banner

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Migrations and tests on PostgreSQL with pgvector
        run: docker compose -f Backend/docker-compose.test.yml run --build --rm backend_test
      - name: Python dependency audit
        run: docker compose -f Backend/docker-compose.test.yml run --rm --no-deps backend_test python -m pip_audit -r requirements/base.txt -r requirements/ai.txt
      - name: Python static checks
        run: |
          docker compose -f Backend/docker-compose.test.yml run --rm --no-deps backend_test python -m ruff check .
          docker compose -f Backend/docker-compose.test.yml run --rm --no-deps backend_test python -m bandit -r apps ai_service services config -x '**/migrations/**' -ll -q
      - name: Verify production containers run without root
        run: |
          docker build -f Backend/Dockerfile -t aelo-backend-check Backend
          docker build -f Backend/ai_service/Dockerfile -t aelo-ai-check Backend
          test "$(docker run --rm --entrypoint id aelo-backend-check -u)" = "10001"
          test "$(docker run --rm --entrypoint id aelo-ai-check -u)" = "10001"
      - name: Stop test services
        if: always()
        run: docker compose -f Backend/docker-compose.test.yml down

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - name: Validate production reverse proxy configuration
        run: docker run --rm -e AELO_DOMAIN=example.test -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

  security-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Live HTTP security checks on synthetic data
        run: docker compose -p aelo-security-ci -f Backend/docker-compose.security.yml run --build --rm security_smoke
      - name: Short load regression with ten synthetic users
        run: docker compose -p aelo-security-ci -f Backend/docker-compose.security.yml run --rm -e VUS=10 -e DURATION=30s load_security run --quiet /scripts/clinic_small.js
      - name: Verify authorization and draft state after load
        run: docker compose -p aelo-security-ci -f Backend/docker-compose.security.yml run --rm --no-deps security_smoke
      - name: Stop isolated security stack
        if: always()
        run: docker compose -p aelo-security-ci -f Backend/docker-compose.security.yml down
