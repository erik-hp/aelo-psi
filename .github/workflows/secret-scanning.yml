name: AELO-PSI Secret Scanning

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan current repository tree (blocking)
        shell: bash
        run: |
          # Never echo scanner findings: they may contain actual credentials.
          # The image is versioned and the repository is mounted read-only.
          set +e
          docker run --rm --network none \
            --volume "$PWD:/repo:ro" --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir --redact --no-banner --log-level error /repo \
            >/dev/null 2>/dev/null
          outcome=$?
          set -e
          if [ "$outcome" -ne 0 ]; then
            echo "Current-tree secret scan failed or found a suspected secret." >> "$GITHUB_STEP_SUMMARY"
            echo "Review locally in a secure environment; do not publish matches or credentials."
            exit 1
          fi
          echo "Current-tree secret scan: passed (no scanner findings)." >> "$GITHUB_STEP_SUMMARY"

      - name: Scan full Git history (inventory; no secrets published)
        if: always()
        shell: bash
        run: |
          set +e
          docker run --rm --network none \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/repo \
            --volume "$PWD:/repo:ro" --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --no-banner --log-level error --log-opts="--all" /repo \
            >/dev/null 2>/dev/null
          outcome=$?
          set -e
          if [ "$outcome" -ne 0 ]; then
            echo "Historical secret scan requires private triage (findings or scan error)." >> "$GITHUB_STEP_SUMMARY"
            echo "Historical secrets cannot be secured merely by removing them from HEAD; rotate affected credentials."
          else
            echo "Historical secret scan: passed (no scanner findings)." >> "$GITHUB_STEP_SUMMARY"
          fi
          # Historical analysis remains non-blocking until triaged; it is not a
          # compliance declaration. The current working tree scan is mandatory.
