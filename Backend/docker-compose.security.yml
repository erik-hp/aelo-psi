services:
  db_security:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aelo_security
      POSTGRES_USER: aelo_security
      POSTGRES_PASSWORD: synthetic-only-database-password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aelo_security -d aelo_security"]
      interval: 2s
      timeout: 2s
      retries: 20
  migrate_security:
    build: .
    environment: &security_environment
      DJANGO_SECRET_KEY: synthetic-only-secret-for-security-stack-2026-12345678901234567890
      AELO_SECURITY_SCENARIO: "1"
      CLINICAL_DATA_KEYS: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      AUDIT_LOG_HMAC_KEY: synthetic-only-audit-key-2026-12345678901234567890
      POSTGRES_DB: aelo_security
      POSTGRES_USER: aelo_security
      POSTGRES_PASSWORD: synthetic-only-database-password
      POSTGRES_HOST: db_security
      DJANGO_ALLOWED_HOSTS: api-security,web-security,localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      JWT_ACCESS_MINUTES: "30"
      DRF_USER_THROTTLE: 100000/hour
    command: sh -c "python manage.py migrate && python manage.py seed_security_scenario && python manage.py seed_security_graphs"
    depends_on:
      db_security:
        condition: service_healthy
  api_security:
    build: .
    environment: *security_environment
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60
    ports:
      - "127.0.0.1:18080:8000"
    networks:
      default:
        aliases:
          - api-security
          - api
    depends_on:
      migrate_security:
        condition: service_completed_successfully
  security_smoke:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      AELO_SECURITY_BASE_URL: http://api-security:8000
      AELO_SECURITY_WEB_URL: http://web-security:8080
    command: python -m tests.live_security_smoke
    depends_on:
      - api_security
      - web_security
  web_security:
    build:
      context: ../Frontend
      dockerfile: Dockerfile.production
    environment:
      AELO_DOMAIN: :8080
    ports:
      - "127.0.0.1:18081:8080"
    networks:
      default:
        aliases:
          - web-security
    depends_on:
      - api_security
  load_security:
    image: grafana/k6:2.3.0
    volumes:
      - ./load:/scripts:ro
    environment:
      BASE_URL: http://api-security:8000
      VUS: "1"
      DURATION: 15m
    command: run /scripts/clinic_small.js
    depends_on:
      - api_security
