services:
  db_test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aelo_test
      POSTGRES_USER: aelo_test
      POSTGRES_PASSWORD: test-only-password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aelo_test -d aelo_test"]
      interval: 2s
      timeout: 2s
      retries: 20
  backend_test:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: test-only-secret-for-compose-do-not-deploy-12345678901234567890
      CLINICAL_DATA_KEYS: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      AUDIT_LOG_HMAC_KEY: test-only-audit-key-12345678901234567890
      POSTGRES_DB: aelo_test
      POSTGRES_USER: aelo_test
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_HOST: db_test
      POSTGRES_PORT: "5432"
    command: sh -c "python manage.py migrate && python -m pytest -c pytest.postgres.ini -q"
    depends_on:
      db_test:
        condition: service_healthy
