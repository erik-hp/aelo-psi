services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aelo}
      POSTGRES_USER: ${POSTGRES_USER:-aelo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Backend/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aelo} -d ${POSTGRES_DB:-aelo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    env_file: .env
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      ai-service:
        condition: service_started

  ai-service:
    build:
      context: .
      dockerfile: ai_service/Dockerfile
    env_file: .env
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN in Backend/.env}
    depends_on:
      - ollama

  vault-worker:
    build: .
    env_file: .env
    command: python manage.py process_vault_jobs
    depends_on:
      migrate:
        condition: service_completed_successfully
      ai-service:
        condition: service_started

  migrate:
    build: .
    env_file: .env
    command: python manage.py migrate
    depends_on:
      db:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  ollama_data:
