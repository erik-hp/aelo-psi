:root{
  --font-ui:"Atkinson Hyperlegible Next",system-ui,sans-serif;
  --font-display:"Fraunces",Georgia,serif;
  --font-record:"Source Serif 4",Georgia,serif;
  --bg:#FAF5EC;--surface:#FFFDF8;--sunk:#F1E9DB;
  --ink:#2A2018;--ink2:#5B4C3F;--ink3:#6B5A4C;
  --primary:#35523F;--primary-hover:#2B4534;--on-primary:#FFFDF8;
  --accent:#A4482B;
  --line:#E4D9C6;--line-strong:#8A7A6A;
  --primary-soft:#E2EBDB;--accent-soft:#F6E1D6;--err:#A92B1F;--err-soft:#F8E1DC;
  --ok:#2F6B45;--ok-soft:#DFEDE2;--warn:#8A5A00;--warn-soft:#F7E9C8;--info:#2C5F7A;--info-soft:#DCEAF1;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 8px 24px -12px rgba(60,40,20,.16);
  --r-panel:20px;--r-ctl:12px;
}
[data-theme="dark"]{
  --bg:#1B1713;--surface:#25201B;--sunk:#15120F;
  --ink:#F3EBDD;--ink2:#CFC3B2;--ink3:#B5A794;
  --primary:#A9CBA0;--primary-hover:#BDD9B5;--on-primary:#16200F;
  --accent:#E8A27C;
  --line:#3A322A;--line-strong:#8F8272;
  --primary-soft:#2A3A2C;--accent-soft:#3F2A20;--err:#FFA89C;--err-soft:#43221E;
  --ok:#9BD4AB;--ok-soft:#213528;--warn:#F0C36A;--warn-soft:#3F3317;--info:#9CCBE4;--info-soft:#1F3340;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{color-scheme:light}[data-theme="dark"]{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--font-ui);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.skip{position:absolute;left:12px;top:-60px;background:var(--primary);color:var(--on-primary);padding:10px 16px;border-radius:var(--r-ctl);z-index:99}
.skip:focus{top:12px}
main:focus{outline:none}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:8px}

/* type */
.display{font-family:var(--font-display);font-weight:520;font-variation-settings:"opsz" 96,"SOFT" 50;letter-spacing:-.015em;line-height:1.08;text-wrap:balance}
.h-xl{font-size:clamp(2rem,1.5rem + 1.8vw,2.9rem)}
.h-lg{font-size:clamp(1.6rem,1.3rem + 1vw,2.2rem)}
.h-md{font-family:var(--font-display);font-weight:560;font-size:1.3rem;letter-spacing:-.01em;line-height:1.2}
.eyebrow{font-size:.9rem;color:var(--ink3);font-weight:500}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}
.record{font-family:var(--font-record);font-size:1.0625rem;line-height:1.75;max-width:68ch}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem}

/* shell */
.app{display:grid;grid-template-columns:264px 1fr;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;padding:22px 16px;display:flex;flex-direction:column;gap:22px;border-right:1px solid var(--line);background:var(--bg)}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.brand b{font:600 1.35rem var(--font-display);letter-spacing:-.01em}
.brand small{display:block;color:var(--ink3);font-size:.8rem;margin-top:-2px}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navgroup>p{padding:0 12px 6px;font-size:.85rem;color:var(--ink3);font-weight:600}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-ctl);color:var(--ink2);font-weight:500;transition:background .15s}
.nav:hover{background:var(--sunk);color:var(--ink)}
.nav[aria-current="page"]{background:var(--primary-soft);color:var(--ink);font-weight:600}
.nav[aria-current="page"] svg{color:var(--primary)}
.nav .count{margin-left:auto;background:var(--accent);color:var(--surface);border-radius:99px;font-size:.78rem;font-weight:700;padding:0 8px;min-width:22px;text-align:center}
[data-theme="dark"] .nav .count{color:#2A1A10}
.rail-foot b{white-space:nowrap}
.rail-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--r-panel);background:var(--sunk)}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:600 .95rem var(--font-display);background:var(--accent-soft);color:var(--accent);flex:none}
.avatar.g{background:var(--primary-soft);color:var(--primary)}
.avatar.b{background:var(--info-soft);color:var(--info)}
.avatar.lg{width:72px;height:72px;font-size:1.5rem}
.main{padding:36px clamp(20px,4vw,56px) 120px;max-width:1240px;width:100%}
.topbar{display:none}

/* primitives */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-panel);box-shadow:var(--shadow)}
.panel.flat{box-shadow:none}
.pad{padding:24px}.pad-s{padding:16px 20px}
.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:24px;align-items:start}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r-ctl);border:1px solid var(--line-strong);background:transparent;font-weight:600;cursor:pointer;transition:background .15s,transform .15s}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.primary:hover{background:var(--primary-hover)}
.btn.ghost{border-color:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:.92rem}
.btn[disabled]{opacity:1;color:var(--ink3);border-style:dashed;cursor:not-allowed;background:transparent}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 8px;border-radius:99px;font-size:.85rem;font-weight:600;line-height:1.6}
.chip svg{width:14px;height:14px}
.c-ok{background:var(--ok-soft);color:var(--ok)}.c-warn{background:var(--warn-soft);color:var(--warn)}.c-err{background:var(--err-soft);color:var(--err)}
.c-info{background:var(--info-soft);color:var(--info)}.c-muted{background:var(--sunk);color:var(--ink2)}.c-pri{background:var(--primary-soft);color:var(--primary)}.c-acc{background:var(--accent-soft);color:var(--accent)}
.tag{display:inline-block;padding:1px 10px;border-radius:8px;background:var(--sunk);color:var(--ink2);font-size:.85rem}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:.95rem}
.input{min-height:46px;padding:0 14px;border-radius:var(--r-ctl);border:1.5px solid var(--line-strong);background:var(--surface);width:100%}
.input::placeholder{color:var(--ink3)}
.search{position:relative}.search svg{position:absolute;left:14px;top:50%;translate:0 -50%;color:var(--ink3);width:18px;height:18px}.search .input{padding-left:42px}
.seg{display:inline-flex;padding:4px;border-radius:var(--r-ctl);background:var(--sunk);gap:2px}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:600;color:var(--ink2);cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:28px 0 24px}
.tabs button{border:0;background:none;padding:12px 16px;font-weight:600;color:var(--ink2);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.banner{display:flex;gap:12px;padding:14px 18px;border-radius:var(--r-ctl);background:var(--info-soft);color:var(--ink);border:1px solid var(--line)}
.banner svg{color:var(--info);flex:none;margin-top:2px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:28px;flex-wrap:wrap}
.pagehead p{margin-top:8px;max-width:60ch}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* table */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.88rem;color:var(--ink3);font-weight:600;padding:12px 16px;border-bottom:1px solid var(--line)}
td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:color-mix(in srgb,var(--sunk) 55%,transparent)}
.tablewrap{overflow-x:auto}

/* timeline (linha de sessões) */
.line{position:relative;padding-left:36px;display:flex;flex-direction:column;gap:20px}
.line::before{content:"";position:absolute;left:11px;top:10px;bottom:10px;width:2px;background:var(--line)}
.line>li{position:relative;list-style:none}
.line>li::before{content:"";position:absolute;left:-31px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--line-strong)}
.line>li.now::before{border-color:var(--accent);background:var(--accent)}
.line>li.done::before{border-color:var(--primary);background:var(--primary)}
ul.plain{list-style:none;margin:0;padding:0}

/* hoje */
.hero{padding:32px;background:linear-gradient(135deg,var(--primary-soft),var(--surface) 70%)}
.hero .time{font:560 3.4rem/1 var(--font-display);font-variation-settings:"opsz" 144,"SOFT" 60;color:var(--primary);letter-spacing:-.03em}
.slot{display:grid;grid-template-columns:64px 1fr auto;gap:16px;align-items:center;padding:14px 4px}
.slot+.slot{border-top:1px solid var(--line)}
.slot .t{font:560 1.15rem var(--font-display);font-variant-numeric:tabular-nums;color:var(--ink2)}
.todo{display:flex;gap:12px;align-items:flex-start;padding:14px 0}
.todo+.todo{border-top:1px solid var(--line)}
.arch{width:44px;height:52px;flex:none;border-radius:22px 22px 8px 8px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}

/* agenda */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 8px;text-align:center;cursor:pointer;font-weight:600}
.day small{display:block;color:var(--ink3);font-weight:500}
.day b{font:560 1.4rem var(--font-display)}
.day[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.day[aria-pressed="true"] small{color:var(--on-primary)}
.day i{display:block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin:4px auto 0}
.agrow{display:grid;grid-template-columns:72px 8px 1fr auto;gap:16px;align-items:center;padding:18px 20px}
.agrow+.agrow{border-top:1px solid var(--line)}
.bar{width:6px;height:56px;border-radius:99px;background:var(--line-strong)}
.bar.ok{background:var(--ok)}.bar.warn{background:var(--warn)}.bar.pri{background:var(--primary)}.bar.err{background:var(--err)}

/* pacientes */
.split{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:start}
.prow{display:grid;grid-template-columns:48px 1fr auto;gap:16px;align-items:center;padding:16px 20px;width:100%;border:0;background:none;text-align:left;cursor:pointer;border-left:4px solid transparent}
.prow+.prow{border-top:1px solid var(--line)}
.prow:hover{background:var(--sunk)}
.prow[aria-pressed="true"]{background:var(--primary-soft);border-left-color:var(--primary)}
.preview{position:sticky;top:24px}

/* editor */
.editor{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.paper{padding:clamp(24px,4vw,56px);min-height:620px}
.paper h2{font:560 1.9rem/1.15 var(--font-display);margin-bottom:6px}
.paper .record{margin-top:18px}
.paper .rule{display:flex;align-items:center;gap:12px;margin:28px 0 6px;font:600 .95rem var(--font-ui);color:var(--accent)}
.paper .rule::after{content:"";flex:1;height:1px;background:var(--line)}
.assist{border:1.5px dashed var(--line-strong);border-radius:16px;padding:16px;background:var(--sunk)}
.statusline{display:flex;gap:16px;flex-wrap:wrap;color:var(--ink3);font-size:.9rem}

/* chart */
.chart{width:100%;height:auto}
.chart text{fill:var(--ink3);font:12px var(--font-ui)}
.chart .gl{stroke:var(--line)}

/* login */
.login{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.login-art{position:relative;overflow:hidden;background:var(--primary);color:var(--on-primary);padding:clamp(32px,5vw,72px);display:flex;flex-direction:column;justify-content:space-between}
[data-theme="dark"] .login-art{background:#26382B;color:#F3EBDD}
.login-art .display{font-size:clamp(2.2rem,1.4rem + 2.6vw,3.8rem);max-width:14ch}
.login-form{display:grid;place-items:center;padding:32px}
.login-form form{width:min(420px,100%);display:flex;flex-direction:column;gap:18px}

/* dock (apenas protótipo) */
.dock{position:fixed;right:16px;bottom:16px;z-index:50;display:flex;gap:8px;align-items:center;max-width:calc(100vw - 32px)}
.dock details{background:var(--ink);color:var(--bg);border-radius:16px;box-shadow:var(--shadow)}
.dock summary{padding:12px 16px;cursor:pointer;font-weight:700;list-style:none;display:flex;gap:8px;align-items:center}
.dock summary::-webkit-details-marker{display:none}
.dock nav{display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:6px 8px 10px;min-width:280px}
.dock nav a{padding:8px 10px;border-radius:10px;font-size:.92rem}
.dock nav a:hover,.dock nav a[aria-current="true"]{background:rgba(255,255,255,.14)}
.dock .tgl{width:48px;height:48px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow)}
.dock details[open]{position:relative}
.dock details[open] nav{position:absolute;bottom:56px;right:0;background:var(--ink);border-radius:16px;box-shadow:var(--shadow)}

@media (max-width:1060px){
  .grid2,.split,.editor{grid-template-columns:1fr}
  .preview{position:static}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
  .week{grid-template-columns:repeat(7,minmax(46px,1fr));overflow-x:auto}
  .login{grid-template-columns:1fr}.login-art{min-height:260px}
  .slot{grid-template-columns:56px 1fr}.slot>:last-child{grid-column:2;justify-self:start}
  .agrow{grid-template-columns:56px 6px 1fr;}.agrow>:last-child{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
@media print{.dock,.rail{display:none}.app{display:block}}
</style>

 return `<a class="btn ghost sm" href="#/pacientes" style="margin:-12px 0 12px -12px">← Pacientes</a>

/* ---------- roteador ---------- */
const ROUTES=Object.keys(TITLES);
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('aelo-theme',t)}catch(e){}render('keep')}
function render(mode){
  const r=(location.hash.replace('#/','')||'login');
  const route=S[r]?r:'nf';
  const f=document.activeElement&&document.activeElement.id;
  const y=scrollY;
  const html=S[route]();
  document.getElementById('root').innerHTML=(route==='login'||route==='nf'&&false)?html:shell(route,html);
  document.title=TITLES[route]+' · AELO (protótipo)';
  document.getElementById('docknav').innerHTML=ROUTES.map(k=>`<a href="#/${k}" ${k===route?'aria-current="true"':''}>${TITLES[k]}</a>`).join('');
  if(mode==='pq'&&f){const e=document.getElementById(f);if(e){e.focus();if(e.setSelectionRange)e.setSelectionRange(e.value.length,e.value.length)}scrollTo(0,y)}
  else if(mode==='keep'){scrollTo(0,y)}
}
addEventListener('hashchange',()=>{render();scrollTo(0,0);const m=document.getElementById('conteudo');if(m)m.focus({preventScroll:true})});
document.getElementById('theme').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
try{const t=localStorage.getItem('aelo-theme');if(t)document.documentElement.dataset.theme=t;else if(matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.dataset.theme='dark'}catch(e){}
if(!location.hash)location.hash='#/login';
render();
</script>
